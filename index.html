            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .panel {

            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);

            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        h2 {

            margin-top: 0;
            text-align: center;
            font-size: 22px;
            letter-spacing: 0.5px;
        }
        .status {

            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 24px;
            border: 1px solid rgba(52, 211, 153, 0.3);
        }
        .service-card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }
        .service-card:hover {
            border-color: #38bdf8;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.1);
        }
        .service-info span {
            display: block;
        }
        .name {
            font-weight: bold;
            color: #f1f5f9;
            font-size: 14px;
        }
        .type {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
        }
        button {
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(2, 132, 199, 0.4);
        }
        button:hover {
            background: #0ea5e9;
            transform: translateY(-1px);
        }
        button:active {
            transform: translateY(1px);
        }
        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: #059669;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            display: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="toast" class="toast">Copied to clipboard successfully!</div>

    <script>
        const currentHost = window.location.host;

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2000);
        }

        function copyTextToClipboard(text, label) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(label + ' copied successfully!');
                }).catch(() => {
                    fallbackCopyText(text, label);
                });
            } else {
                fallbackCopyText(text, label);
            }
        }

        function fallbackCopyText(text, label) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast(label + ' copied successfully!');
            } catch (err) {
                showToast('Failed to copy!');
            }
            document.body.removeChild(textArea);
        }

            } else if (type === 'vless') {

            } else if (type === 'vmess') {
                label = "VMess";
