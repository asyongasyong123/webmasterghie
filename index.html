<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webmasterghie Panel</title>
    <style>
        :root {
            --bg-color: #fff1f2;
            --panel-bg: #ffffff;
            --text-color: #1e293b;
            --primary-red: #e11d48;
            --primary-red-hover: #be123c;
            --card-bg: #fff5f5;
            --border-color: #fecdd3;
        }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .panel {
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(225, 29, 72, 0.15);
            width: 440px;
            border: 1px solid var(--border-color);
        }

        h2 {
            color: var(--primary-red);
            margin-top: 0;
            text-align: center;
            font-size: 22px;
            letter-spacing: 0.5px;
        }

        .status {
            text-align: center;
            background: rgba(16, 185, 129, 0.15);
            color: #059669;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 24px;
            border: 1px solid rgba(52, 211, 153, 0.3);
        }

        .service-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .service-card:hover {
            border-color: var(--primary-red);
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.1);
        }

        .service-info span {
            display: block;
        }

        .name {
            font-weight: bold;
            color: #0f172a;
            font-size: 14px;
        }

        .type {
            font-size: 11px;
            color: #64748b;
            margin-top: 2px;
        }

        button {
            background: var(--primary-red);
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(225, 29, 72, 0.3);
        }

        button:hover {
            background: var(--primary-red-hover);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            display: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="panel">
        <h2>Webmasterghie Panel</h2>
        <div class="status">&#9989; Cloud Run Tunnel Online</div>
        
        <div class="service-card">
            <div class="service-info">
                <span class="name">Trojan WS</span>
                <span class="type">Path: /tr-webmasterghie18</span>
            </div>
            <button onclick="copyConfig('trojan')">Copy</button>
        </div>

        <div class="service-card">
            <div class="service-info">
                <span class="name">VLESS WS</span>
                <span class="type">Path: /vl-webmasterghie18</span>
            </div>
            <button onclick="copyConfig('vless')">Copy</button>
        </div>

        <div class="service-card">
            <div class="service-info">
                <span class="name">VMess WS</span>
                <span class="type">Path: /vm-webmasterghie18</span>
            </div>
            <button onclick="copyConfig('vmess')">Copy</button>
        </div>

        <div class="service-card">
            <div class="service-info">
                <span class="name">Shadowsocks WS</span>
                <span class="type">Path: /ss-webmasterghie18</span>
            </div>
            <button onclick="copyConfig('ss')">Copy</button>
        </div>
    </div>

    <div id="toast" class="toast">Copied to clipboard successfully!</div>

    <script>
        const currentHost = window.location.host;

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2000);
        }

        function copyTextToClipboard(text, label) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(label + ' copied successfully!');
                }).catch(() => {
                    fallbackCopyText(text, label);
                });
            } else {
                fallbackCopyText(text, label);
            }
        }

        function fallbackCopyText(text, label) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast(label + ' copied successfully!');
            } catch (err) {
                showToast('Failed to copy!');
            }
            document.body.removeChild(textArea);
        }

        function copyConfig(type) {
            let link = "";
            let label = "";

            if (type === 'trojan') {
                label = "Trojan";
                link = "trojan://webmasterghie18@apps.google.com:443?type=ws&host=" + currentHost + "&headerType=none&path=%2Ftr-webmasterghie18&security=tls&sni=firebaseremoteconfigrealtime.googleapis.com#%F0%9D%91%8A%F0%9D%91%92%F0%9D%91%8F%F0%9D%91%9A%F0%9D%91%8E%F0%9D%91%A0%F0%9D%91%A1%F0%9D%91%92%F0%9D%91%9F%20%F0%9D%90%BA%F0%9D%91%90%F0%9D%91%9D%20%F0%9D%91%86%F0%9D%91%A1%F0%9D%91%A0%20%F0%9D%91%81%F0%9D%91%9C%F0%9D%91%99%F0%9D%91%9C%F0%9D%91%8E%F0%9D%91%91%20%F0%9D%90%B6%F0%9D%91%9C%F0%9D%91%9B%F0%9D%91%93%F0%9D%91%96%F0%9D%91%94";
            } else if (type === 'vless') {
                label = "VLESS";
                link = "vless://d3f1a2b4-7e5c-4f8b-9c1d-2a3b4e5f6a7b@apps.google.com:443?encryption=none&type=ws&host=" + currentHost + "&headerType=none&path=%2Fvl-webmasterghie18&security=tls&sni=firebaseremoteconfigrealtime.googleapis.com#%F0%9D%91%8A%F0%9D%91%92%F0%9D%91%8F%F0%9D%91%9A%F0%9D%91%8E%F0%9D%91%A0%F0%9D%91%A1%F0%9D%91%92%F0%9D%91%9F%20%F0%9D%90%BA%F0%9D%91%90%F0%9D%91%9D%20%F0%9D%91%86%F0%9D%91%A1%F0%9D%91%A0%20%F0%9D%91%81%F0%9D%91%9C%F0%9D%91%99%F0%9D%91%9C%F0%9D%91%8E%F0%9D%91%91%20%F0%9D%90%B6%F0%9D%91%9C%F0%9D%91%9B%F0%9D%91%93%F0%9D%91%96%F0%9D%91%94";
            } else if (type === 'vmess') {
                label = "VMess";
                const vmessJson = `{"v":"2","ps":"✨ - Webmasterghie","add":"apps.google.com","port":"443","id":"a7c8d9e0-f1b2-43c4-85d6-123456789abc","aid":"0","scy":"auto","net":"ws","type":"none","host":"${currentHost}","path":"/vm-webmasterghie18","tls":"tls","sni":"firebaseremoteconfigrealtime.googleapis.com"}`;
                link = "vmess://" + btoa(vmessJson);
            } else if (type === 'ss') {
                label = "Shadowsocks";
                link = "ss://Y2hhY2hhMjAtaWV0Zi1wb2x5MTMwNTp3ZWJtYXN0ZXJnaGllMTg=@apps.google.com:443?type=ws&host=" + currentHost + "&headerType=none&path=%2Fss-webmasterghie18&security=tls&fp=chrome&sni=firebaseremoteconfigrealtime.googleapis.com&alpn=h2%2C%20http%2F1.1#%F0%9D%90%B8%F0%9D%91%A0%20%F0%9D%91%A1%F0%9D%91%92%20%F0%9D%90%B8%F0%9D%91%A0%E2%9C%A8%EF%B8%8F";
            }

            copyTextToClipboard(link, label);
        }
    </script>
</body>
</html>
